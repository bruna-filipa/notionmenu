
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>My Personal Journal | Everyday Edition</title>

<style>
  @font-face {
    font-family: "Dream Orphans";
    src: url("./fonts/DreamOrphans.otf")
         format("opentype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  * {
    margin: 0;
    padding: 0;
    border: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  .title {
    position: absolute;
    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    display: flex;
    align-items: flex-start;
    justify-content: flex-start;

    font-family: "Dream Orphans", Georgia, serif;
        font-size: 150px;
    font-weight: 400;
    color: #402D19;
    line-height: 1;
    text-align: left;
    white-space: nowrap;
  }

  .title span {
    display: block;
    transform-origin: top left;
  }
</style>
</head>

<body>

<div class="title">
  <span id="titleText">
    My Personal Journal | Everyday Edition
  </span>
</div>

<script>
  const title = document.querySelector(".title");
  const text = document.getElementById("titleText");

  function resizeTitle() {
    const availableWidth = title.clientWidth;
    const availableHeight = title.clientHeight;

    if (!availableWidth || !availableHeight) return;

    // Start large, then calculate the best fit.
    text.style.fontSize = "100px";

    const naturalWidth = text.scrollWidth;
    const naturalHeight = text.scrollHeight;

    const scale = Math.min(
      availableWidth / naturalWidth,
      availableHeight / naturalHeight
    );

    text.style.fontSize = (100 * scale) + "px";
  }

  document.fonts.ready.then(resizeTitle);

  window.addEventListener("resize", resizeTitle);

  new ResizeObserver(resizeTitle).observe(title);
</script>

</body>
</html>
