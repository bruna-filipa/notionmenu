
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>My Personal Journal | Everyday Edition</title>

  <style>
    /* CUSTOM FONT */
    @font-face {
      font-family: "Dream Orphans";
      src: url("./fonts/DreamOrphans.otf")
           format("opentype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* RESET */
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    /* TITLE CONTAINER */
    .title-container {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      height: 100vh;
      margin: 0;
      padding: 0;
    }

    /* MAIN TITLE */
    .dashboard-title {
      margin: 0;
      padding: 0;
      font-family: "Dream Orphans", Georgia, serif;
      font-size: clamp(28px, 4vw, 52px);
      font-weight: normal;
      line-height: 1.2;
      color: #402D19;
      text-align: left;
      overflow-wrap: break-word;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .dashboard-title {
        font-size: clamp(24px, 5vw, 36px);
      }
    }
  </style>
</head>

<body>
  <main class="title-container">
    <h1 class="dashboard-title">
      My Personal Journal | Everyday Edition
    </h1>
  </main>
</body>
</html>
