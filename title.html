
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>My Little World</title>

  <style>
    /* BLACKER SHIELD FONT */
    @font-face {
      font-family: "Blacker Shield";
      src: url("./fonts/BlackerShield.ttf")
           format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* PAGE RESET */
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: transparent;
      overflow: hidden;
    }

    /* TITLE CONTAINER */
    .title-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 12px 8px;
    }

    /* MAIN TITLE */
    .dashboard-title {
      margin: 0;
      font-family: "Blacker Shield", Georgia, serif;
      font-size: clamp(36px, 6vw, 64px);
      font-weight: normal;
      line-height: 1.25;
      color: #402D19;
      text-align: center;
      overflow-wrap: break-word;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .title-container {
        padding: 8px 6px;
      }

      .dashboard-title {
        font-size: clamp(30px, 8vw, 44px);
      }
    }
  </style>
</head>

<body>
  <main class="title-container">
    <h1 class="dashboard-title">
      My Little World
    </h1>
  </main>
</body>
</html>
