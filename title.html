
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>The Everyday Edit</title>

  <style>
    @font-face {
      font-family: "Dream Orphans";
      src: url("./fonts/DreamOrphans.otf")
           format("opentype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: transparent;
      overflow: hidden;
    }

    .title-container {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .dashboard-title {
      display: block;
      margin: 0;
      padding: 0;
      font-family: "Dream Orphans", Georgia, serif;
      font-size: clamp(36px, 5vw, 64px);
      font-weight: normal;
      line-height: 1.2;
      color: #402D19;
      text-align: left;
    }

    @media (max-width: 600px) {
      .dashboard-title {
        font-size: clamp(30px, 7vw, 44px);
      }
    }
  </style>
</head>

<body>
  <main class="title-container">
    <h1 class="dashboard-title">
      The Everyday Edit
    </h1>
  </main>
</body>
</html>
