
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<style>
  @font-face {
    font-family: "Dream Orphans";
    src: url("./fonts/DreamOrphans.otf")
         format("opentype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  * {
    margin: 0;
    padding: 0;
    border: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }

  .title {
    position: absolute;
    top: 0;
    left: 0;

    margin: 0;
    padding: 0;

    font-family: "Dream Orphans", Georgia, serif;
    font-size: clamp(28px, 4vw, 52px);
    font-weight: 400;
    line-height: 1;
    color: #402D19;
    text-align: left;
    white-space: normal;
  }
</style>
</head>

<body>
<div class="title">My Personal Journal | Everyday Edition</div>
</body>
</html>
