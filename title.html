
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>The Personal Edit</title>

  <style>
    @font-face {
      font-family: "Blacker Shield";
      src: url("./fonts/BlackerShield.ttf")
           format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: transparent;
      overflow: hidden;
    }

    .title-container {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      padding: 12px 16px;
    }

    .dashboard-title {
      margin: 0;
      font-family: "Blacker Shield", Georgia, serif;
      font-size: clamp(34px, 5vw, 60px);
      font-weight: normal;
      line-height: 1.25;
      color: #402D19;
      text-align: right;
    }

    @media (max-width: 600px) {
      .title-container {
        padding: 8px 12px;
      }

      .dashboard-title {
        font-size: clamp(28px, 7vw, 42px);
      }
    }
  </style>
</head>

<body>
  <main class="title-container">
    <h1 class="dashboard-title">
      The Personal Edit
    </h1>
  </main>
</body>
</html>
