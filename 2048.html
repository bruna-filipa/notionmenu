
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Romantic Garden | 2048</title>

<style>
@font-face {
  font-family: "Dream Orphans";
  src: url("./fonts/Dream Orphans.otf") format("opentype");
  font-display: swap;
}

:root {
  --white: #FFFFFF;
  --pink: #F5DFE5;
  --rose: #BF687C;
  --burgundy: #8D2B36;
  --espresso: #402D19;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--white);
  color: var(--espresso);
  font-family: "Dream Orphans", Georgia, serif;
}

.game {
  width: min(100%, 440px);
  margin: 0 auto;
  padding: 12px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}

.scores {
  display: flex;
  gap: 8px;
}

.score-box {
  min-width: 75px;
  padding: 8px 12px;
  border-radius: 9px;
  background: var(--pink);
  text-align: center;
}

.score-label {
  font-family: Arial, sans-serif;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--burgundy);
}

.score-number {
  font-size: 27px;
  line-height: 1.1;
  color: var(--espresso);
}

.new-game {
  border: 1px solid var(--rose);
  border-radius: 9px;
  padding: 12px 15px;
  background: var(--white);
  color: var(--burgundy);
  font-family: inherit;
  font-size: 17px;
  cursor: pointer;
  transition: background .2s;
}

.new-game:hover {
  background: var(--pink);
}

.board {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  aspect-ratio: 1;
  padding: 10px;
  border-radius: 16px;
  background: var(--pink);
  touch-action: none;
  user-select: none;
}

.cell {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  border-radius: 10px;
  background: rgba(255,255,255,.6);
  color: var(--espresso);
  font-size: clamp(22px, 7vw, 42px);
  line-height: 1;
  transition: background .12s;
}

.cell[data-value="2"] {
  background: #FFFFFF;
}

.cell[data-value="4"] {
  background: #FCEFF3;
}

.cell[data-value="8"] {
  background: #F2D4DD;
}

.cell[data-value="16"] {
  background: #E8B9C7;
}

.cell[data-value="32"] {
  background: #DB9EAE;
}

.cell[data-value="64"] {
  background: #CE8297;
}

.cell[data-value="128"] {
  background: #BF687C;
  color: white;
}

.cell[data-value="256"] {
  background: #AD4E65;
  color: white;
}

.cell[data-value="512"] {
  background: #9B394E;
  color: white;
}

.cell[data-value="1024"] {
  background: #8D2B36;
  color: white;
}

.cell[data-value="2048"] {
  background: #70202C;
  color: white;
}

.cell[data-large="true"] {
  font-size: clamp(17px, 5vw, 29px);
}

.overlay {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 20px;
  border-radius: 16px;
  background: rgba(255,255,255,.93);
  text-align: center;
  z-index: 2;
}

.overlay.visible {
  display: flex;
}

.overlay-title {
  font-size: 35px;
  color: var(--burgundy);
}

.overlay button {
  padding: 11px 22px;
  border: 0;
  border-radius: 8px;
  background: var(--burgundy);
  color: white;
  font-family: inherit;
  font-size: 19px;
  cursor: pointer;
}

.instructions {
  margin: 12px 0 0;
  text-align: center;
  font-family: Arial, sans-serif;
  font-size: 11px;
  color: var(--rose);
}

@media (max-width: 350px) {
  .game {
    padding: 5px;
  }

  .board {
    gap: 6px;
    padding: 6px;
  }

  .header {
    gap: 5px;
  }

  .score-box {
    min-width: 60px;
    padding: 7px;
  }

  .new-game {
    padding: 10px;
    font-size: 14px;
  }
}
</style>
</head>

<body>

<main class="game">

  <div class="header">

    <div class="scores">

      <div class="score-box">
        <div class="score-label">Score</div>
        <div class="score-number" id="score">0</div>
      </div>

      <div class="score-box">
        <div class="score-label">Best</div>
        <div class="score-number" id="best">0</div>
      </div>

    </div>

    <button class="new-game" id="newGame">
      New Game
    </button>

  </div>

  <div
    class="board"
    id="board"
    tabindex="0"
    aria-label="2048 game board"
  >

    <div class="overlay" id="overlay">

      <div class="overlay-title" id="message"></div>

      <button id="overlayButton">
        Play Again
      </button>

    </div>

  </div>

  <p class="instructions">
    Use your arrow keys or swipe to combine matching tiles
  </p>

</main>

<script>
const SIZE = 4;
const STORAGE = "romanticGarden2048V1";
const BEST_STORAGE = "romanticGarden2048BestV1";

const boardElement = document.getElementById("board");
const scoreElement = document.getElementById("score");
const bestElement = document.getElementById("best");
const overlay = document.getElementById("overlay");
const message = document.getElementById("message");

let board = emptyBoard();
let score = 0;
let best = Number(localStorage.getItem(BEST_STORAGE)) || 0;
let won = false;
let keepPlaying = false;
let over = false;

function emptyBoard() {
  return Array.from(
    { length: SIZE },
    () => Array(SIZE).fill(0)
  );
}

function save() {
  try {
    localStorage.setItem(
      STORAGE,
      JSON.stringify({
        board,
        score,
        won,
        keepPlaying,
        over
      })
    );

    localStorage.setItem(
      BEST_STORAGE,
      String(best)
    );
  } catch (e) {}
}

function load() {
  try {
    const saved = JSON.parse(
      localStorage.getItem(STORAGE)
    );

    if (
      saved &&
      Array.isArray(saved.board) &&
      saved.board.length === SIZE &&
      saved.board.every(row =>
        Array.isArray(row) &&
        row.length === SIZE &&
        row.every(n =>
          Number.isSafeInteger(n) && n >= 0
        )
      )
    ) {
      board = saved.board;
      score = Number(saved.score) || 0;
      won = Boolean(saved.won);
      keepPlaying = Boolean(saved.keepPlaying);
      over = Boolean(saved.over);
      best = Math.max(best, score);
      return true;
    }
  } catch (e) {}

  return false;
}

function addTile() {
  const empty = [];

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === 0) {
        empty.push([r, c]);
      }
    }
  }

  if (!empty.length) return;

  const [r, c] = empty[
    Math.floor(Math.random() * empty.length)
  ];

  board[r][c] = Math.random() < .9 ? 2 : 4;
}

function newGame() {
  board = emptyBoard();
  score = 0;
  won = false;
  keepPlaying = false;
  over = false;

  addTile();
  addTile();

  save();
  render();
}

function mergeLine(line) {
  const values = line.filter(n => n !== 0);
  const result = [];
  let gained = 0;

  for (let i = 0; i < values.length; i++) {
    if (values[i] === values[i + 1]) {
      const merged = values[i] * 2;
      result.push(merged);
      gained += merged;
      i++;
    } else {
      result.push(values[i]);
    }
  }

  while (result.length < SIZE) {
    result.push(0);
  }

  return { result, gained };
}

function canMove() {
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === 0) return true;

      if (
        r < SIZE - 1 &&
        board[r][c] === board[r + 1][c]
      ) return true;

      if (
        c < SIZE - 1 &&
        board[r][c] === board[r][c + 1]
      ) return true;
    }
  }

  return false;
}

function move(direction) {
  if (over || (won && !keepPlaying)) return;

  const next = emptyBoard();
  let gained = 0;

  for (let index = 0; index < SIZE; index++) {
    let line = [];

    for (let i = 0; i < SIZE; i++) {
      if (
        direction === "left" ||
        direction === "right"
      ) {
        line.push(board[index][i]);
      } else {
        line.push(board[i][index]);
      }
    }

    const reversed =
      direction === "right" ||
      direction === "down";

    if (reversed) line.reverse();

    const merged = mergeLine(line);
    gained += merged.gained;

    if (reversed) merged.result.reverse();

    for (let i = 0; i < SIZE; i++) {
      if (
        direction === "left" ||
        direction === "right"
      ) {
        next[index][i] = merged.result[i];
      } else {
        next[i][index] = merged.result[i];
      }
    }
  }

  const changed =
    JSON.stringify(next) !== JSON.stringify(board);

  if (!changed) return;

  board = next;
  score += gained;
  best = Math.max(best, score);

  addTile();

  if (
    !won &&
    board.some(row => row.some(n => n >= 2048))
  ) {
    won = true;
  }

  if (!canMove()) {
    over = true;
  }

  save();
  render();
}

function render() {
  boardElement
    .querySelectorAll(".cell")
    .forEach(cell => cell.remove());

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const value = board[r][c];
      const cell = document.createElement("div");

      cell.className = "cell";

      if (value) {
        cell.textContent = value;
        cell.dataset.value = String(
          Math.min(value, 2048)
        );

        if (value >= 1024) {
          cell.dataset.large = "true";
        }
      }

      boardElement.insertBefore(cell, overlay);
    }
  }

  scoreElement.textContent = score;
  bestElement.textContent = best;

  overlay.classList.toggle(
    "visible",
    over || (won && !keepPlaying)
  );

  if (over) {
    message.textContent = "Game Over";

    document.getElementById(
      "overlayButton"
    ).textContent = "Try Again";

  } else if (won && !keepPlaying) {
    message.textContent = "You reached 2048!";

    document.getElementById(
      "overlayButton"
    ).textContent = "Keep Playing";
  }
}

document.getElementById(
  "newGame"
).addEventListener("click", newGame);

document.getElementById(
  "overlayButton"
).addEventListener("click", () => {
  if (over) {
    newGame();
  } else {
    keepPlaying = true;
    save();
    render();
  }
});

const directions = {
  ArrowLeft: "left",
  ArrowRight: "right",
  ArrowUp: "up",
  ArrowDown: "down"
};

document.addEventListener("keydown", event => {
  if (!directions[event.key]) return;

  event.preventDefault();
  move(directions[event.key]);
});

let touchStart = null;

boardElement.addEventListener(
  "touchstart",
  event => {
    if (event.touches.length !== 1) return;

    touchStart = {
      x: event.touches[0].clientX,
      y: event.touches[0].clientY
    };
  },
  { passive: true }
);

boardElement.addEventListener(
  "touchend",
  event => {
    if (
      !touchStart ||
      !event.changedTouches.length
    ) return;

    const dx =
      event.changedTouches[0].clientX -
      touchStart.x;

    const dy =
      event.changedTouches[0].clientY -
      touchStart.y;

    touchStart = null;

    if (
      Math.max(Math.abs(dx), Math.abs(dy)) < 25
    ) return;

    if (Math.abs(dx) > Math.abs(dy)) {
      move(dx > 0 ? "right" : "left");
    } else {
      move(dy > 0 ? "down" : "up");
    }
  },
  { passive: true }
);

if (!load()) {
  newGame();
} else {
  render();
}
</script>

</body>
</html>
