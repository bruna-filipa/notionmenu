
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Romantic Pomodoro</title>

<style>
  @font-face {
    font-family: "Antone";
    src: url("./fonts/Antone.ttf")
         format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --background: #F5DFE5;
    --active: #8D2B36;
    --inactive: #BE677C;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: var(--background);
  }

  body {
    font-family: "Antone", Arial, sans-serif;
    color: var(--active);
  }

  .pomodoro {
    width: 100%;
    min-height: 350px;
    padding: 30px 24px 35px;
    background: var(--background);

    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* TIMER MODES */

  .modes {
    width: 100%;
    max-width: 850px;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .mode {
    border: none;
    background: transparent;

    color: var(--inactive);
    font-family: "Antone", Arial, sans-serif;
    font-size: clamp(12px, 2.5vw, 26px);
    font-weight: 400;
    letter-spacing: 3px;

    cursor: pointer;
    padding: 10px 0;
    white-space: nowrap;

    transition: color 0.2s ease;
  }

  .mode.active,
  .mode:hover {
    color: var(--active);
  }

  /* TIMER DISPLAY */

  .timer {
    margin-top: 55px;

    font-family: "Antone", Arial, sans-serif;
    font-size: clamp(85px, 18vw, 165px);
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
    line-height: 1.15;

    color: var(--active);
    text-align: center;
  }

  /* CONTROLS */

  .controls {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 55px;
    margin-top: 45px;
  }

  .control {
    background: transparent;
    border: none;
    color: var(--active);

    padding: 8px;
    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    transition: opacity 0.2s ease;
  }

  .control:hover {
    opacity: 0.65;
  }

  .control svg {
    width: 35px;
    height: 35px;

    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  /* RESPONSIVE */

  @media (max-width: 480px) {
    .pomodoro {
      min-height: 280px;
      padding: 20px 12px 25px;
    }

    .mode {
      font-size: clamp(10px, 2.8vw, 14px);
      letter-spacing: 1px;
    }

    .timer {
      margin-top: 48px;
      font-size: clamp(72px, 18vw, 110px);
    }

    .controls {
      margin-top: 35px;
      gap: 40px;
    }
  }
</style>
</head>

<body>

<div class="pomodoro">

  <!-- MODES -->

  <nav class="modes" aria-label="Timer modes">

    <button
      class="mode"
      data-mode="short"
      onclick="changeMode('short')">
      SHORT BREAK
    </button>

    <button
      class="mode active"
      data-mode="focus"
      onclick="changeMode('focus')">
      FOCUS
    </button>

    <button
      class="mode"
      data-mode="long"
      onclick="changeMode('long')">
      LONG BREAK
    </button>

  </nav>

  <!-- TIMER -->

  <div
    class="timer"
    id="timer"
    role="timer"
    aria-label="Time remaining">
    15:00
  </div>

  <!-- BUTTONS -->

  <div class="controls">

    <!-- PLAY / PAUSE -->

    <button
      class="control"
      id="playPause"
      onclick="toggleTimer()"
      aria-label="Play timer"
      title="Play / Pause">

      <svg id="playIcon" viewBox="0 0 24 24">
        <path d="M6 3 L20 12 L6 21 Z"/>
      </svg>

    </button>

    <!-- RESET -->

    <button
      class="control"
      onclick="resetTimer()"
      aria-label="Reset timer"
      title="Reset timer">

      <svg viewBox="0 0 24 24">
        <path d="M3 11a9 9 0 1 1 2.5 6.2"/>
        <path d="M3 4v7h7"/>
      </svg>

    </button>

  </div>

</div>

<script>
  const durations = {
    short: 5 * 60,
    focus: 15 * 60,
    long: 30 * 60
  };

  let currentMode = "focus";
  let remaining = durations.focus;
  let interval = null;
  let endTime = null;

  const timerDisplay = document.getElementById("timer");
  const playPauseButton = document.getElementById("playPause");
  const playIcon = document.getElementById("playIcon");

  const playSVG = `
    <path d="M6 3 L20 12 L6 21 Z"/>
  `;

  const pauseSVG = `
    <path d="M8 4v16 M16 4v16"/>
  `;

  /* DISPLAY TIME */

  function displayTime() {
    const minutes = Math.floor(remaining / 60);
    const seconds = remaining % 60;

    timerDisplay.textContent =
      String(minutes).padStart(2, "0") + ":" +
      String(seconds).padStart(2, "0");
  }

  /* UPDATE PLAY / PAUSE ICON */

  function updateIcon() {
    const isRunning = interval !== null;

    playIcon.innerHTML = isRunning ? pauseSVG : playSVG;

    playPauseButton.setAttribute(
      "aria-label",
      isRunning ? "Pause timer" : "Play timer"
    );
  }

  /* STOP TIMER */

  function stopTimer() {
    if (interval !== null) {
      clearInterval(interval);
      interval = null;
    }

    endTime = null;
    updateIcon();
  }

  /* CHANGE MODE */

  function changeMode(mode) {
    stopTimer();

    currentMode = mode;
    remaining = durations[mode];

    document.querySelectorAll(".mode").forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.mode === mode
      );
    });

    displayTime();
  }

  /* PLAY / PAUSE / RESUME */

  function toggleTimer() {

    // Pause and preserve remaining time
    if (interval !== null) {
      remaining = Math.max(
        0,
        Math.ceil((endTime - Date.now()) / 1000)
      );

      stopTimer();
      displayTime();
      return;
    }

    // Restart only when countdown has finished
    if (remaining === 0) {
      remaining = durations[currentMode];
    }

    // Play or resume from remaining time
    endTime = Date.now() + remaining * 1000;

    interval = setInterval(() => {
      remaining = Math.max(
        0,
        Math.ceil((endTime - Date.now()) / 1000)
      );

      displayTime();

      if (remaining === 0) {
        stopTimer();
      }
    }, 250);

    updateIcon();
  }

  /* RESET TIMER */

  function resetTimer() {
    stopTimer();
    remaining = durations[currentMode];
    displayTime();
  }

  /* INITIALISE */

  displayTime();
  updateIcon();
</script>

</body>
</html>
