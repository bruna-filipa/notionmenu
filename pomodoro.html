
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Romantic Pomodoro</title>

<style>
@font-face {
  font-family: "Antone";
  src: url("./fonts/Antone.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

:root {
  --background: #F5DFE5;
  --active: #8D2B36;
  --inactive: #BE677C;

  --vertical-padding: 60px;
  --horizontal-padding: 32px;
}

* {
  box-sizing: border-box;
}

html {
  margin: 0;
  padding: 0;
  width: 100%;
  background: var(--background);
}

body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100vh;
  background: var(--background);
  color: var(--active);
  font-family: "Antone", Arial, sans-serif;
}

/* OUTER FRAME */

.widget-frame {
  width: 100%;
  padding:
    var(--vertical-padding)
    var(--horizontal-padding);
  background: var(--background);
}

/* POMODORO */

.pomodoro {
  width: 100%;
  max-width: 650px;
  margin: 0 auto;

  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 35px;
}

/* MODES */

.modes {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  gap: 8px;
}

.mode {
  flex: 1;
  min-width: 0;

  padding: 0;
  border: none;
  background: transparent;

  color: var(--inactive);
  font-family: "Antone", Arial, sans-serif;
  font-size: clamp(9px, 2.6vw, 24px);
  font-weight: 400;
  letter-spacing: 0.5px;

  white-space: nowrap;
  text-align: center;
  cursor: pointer;

  transition: color 0.2s ease;
}

.mode.active,
.mode:hover {
  color: var(--active);
}

/* TIMER */

.timer {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 100%;

  color: var(--active);
  font-family: "Antone", Arial, sans-serif;
  font-size: clamp(48px, 18vw, 130px);
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  text-align: center;
  white-space: nowrap;
}

/* CONTROLS */

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 35px;
}

.control {
  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;
  border: none;
  background: transparent;
  color: var(--active);
  cursor: pointer;

  transition: opacity 0.2s ease;
}

.control:hover {
  opacity: 0.65;
}

.control svg {
  width: 26px;
  height: 26px;

  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* SMALL NOTION EMBEDS */

@media (max-width: 400px) {
  :root {
    --horizontal-padding: 18px;
  }

  .pomodoro {
    gap: 28px;
  }

  .mode {
    font-size: clamp(8px, 2.6vw, 14px);
  }

  .timer {
    font-size: clamp(36px, 17vw, 75px);
  }

  .control svg {
    width: 23px;
    height: 23px;
  }
}

@media (max-width: 250px) {
  :root {
    --horizontal-padding: 10px;
  }

  .pomodoro {
    gap: 22px;
  }

  .mode {
    font-size: 8px;
    letter-spacing: 0;
  }

  .timer {
    font-size: clamp(30px, 16vw, 45px);
  }

  .controls {
    gap: 25px;
  }

  .control svg {
    width: 20px;
    height: 20px;
  }
}
</style>
</head>

<body>

<div class="widget-frame">

  <main class="pomodoro">

    <nav class="modes" aria-label="Timer modes">

      <button
        class="mode"
        data-mode="short"
        onclick="changeMode('short')">
        SHORT BREAK
      </button>

      <button
        class="mode active"
        data-mode="focus"
        onclick="changeMode('focus')">
        FOCUS
      </button>

      <button
        class="mode"
        data-mode="long"
        onclick="changeMode('long')">
        LONG BREAK
      </button>

    </nav>

    <div
      class="timer"
      id="timer"
      role="timer"
      aria-label="Time remaining">
      15:00
    </div>

    <div class="controls">

      <button
        class="control"
        id="playPause"
        onclick="toggleTimer()"
        aria-label="Play timer"
        title="Play / Pause">

        <svg id="playIcon" viewBox="0 0 24 24">
          <path d="M6 3 L20 12 L6 21 Z"/>
        </svg>

      </button>

      <button
        class="control"
        onclick="resetTimer()"
        aria-label="Reset timer"
        title="Reset timer">

        <svg viewBox="0 0 24 24">
          <path d="M3 11a9 9 0 1 1 2.5 6.2"/>
          <path d="M3 4v7h7"/>
        </svg>

      </button>

    </div>

  </main>

</div>

<script>
const durations = {
  short: 5 * 60,
  focus: 15 * 60,
  long: 30 * 60
};

let currentMode = "focus";
let remaining = durations.focus;
let interval = null;
let endTime = null;

const timerDisplay = document.getElementById("timer");
const playPauseButton = document.getElementById("playPause");
const playIcon = document.getElementById("playIcon");

const playSVG = `
  <path d="M6 3 L20 12 L6 21 Z"/>
`;

const pauseSVG = `
  <path d="M8 4v16 M16 4v16"/>
`;

function displayTime() {
  const minutes = Math.floor(remaining / 60);
  const seconds = remaining % 60;

  timerDisplay.textContent =
    String(minutes).padStart(2, "0") + ":" +
    String(seconds).padStart(2, "0");
}

function updateIcon() {
  const isRunning = interval !== null;

  playIcon.innerHTML = isRunning ? pauseSVG : playSVG;

  playPauseButton.setAttribute(
    "aria-label",
    isRunning ? "Pause timer" : "Play timer"
  );
}

function stopTimer() {
  if (interval !== null) {
    clearInterval(interval);
    interval = null;
  }

  endTime = null;
  updateIcon();
}

function changeMode(mode) {
  stopTimer();

  currentMode = mode;
  remaining = durations[mode];

  document.querySelectorAll(".mode").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.mode === mode
    );
  });

  displayTime();
}

function toggleTimer() {
  if (interval !== null) {
    remaining = Math.max(
      0,
      Math.ceil((endTime - Date.now()) / 1000)
    );

    stopTimer();
    displayTime();
    return;
  }

  if (remaining === 0) {
    remaining = durations[currentMode];
  }

  endTime = Date.now() + remaining * 1000;

  interval = setInterval(() => {
    remaining = Math.max(
      0,
      Math.ceil((endTime - Date.now()) / 1000)
    );

    displayTime();

    if (remaining === 0) {
      stopTimer();
    }
  }, 250);

  updateIcon();
}

function resetTimer() {
  stopTimer();
  remaining = durations[currentMode];
  displayTime();
}

displayTime();
updateIcon();
</script>

</body>
</html>
