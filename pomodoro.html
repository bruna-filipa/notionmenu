
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Romantic Pomodoro</title>

<style>
  @font-face {
    font-family: "Antone";
    src: url("./fonts/Antone.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --background: #F5DFE5;
    --active: #8D2B36;
    --inactive: #BE677C;

    --padding-vertical: 48px;
    --padding-horizontal: 32px;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--background);
  }

  body {
    font-family: "Antone", Arial, sans-serif;
    color: var(--active);
  }

  /* OUTER SPACING */

  .widget-frame {
    width: 100%;
    height: 100%;

    padding:
      var(--padding-vertical)
      var(--padding-horizontal);

    background: var(--background);
  }

  /* POMODORO CONTAINER */

  .pomodoro {
    container-type: size;

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;

    padding: 5cqh 4cqw;
    background: var(--background);
    overflow: hidden;
  }

  /* TIMER MODES */

  .modes {
    display: flex;
    justify-content: space-between;
    align-items: center;

    width: 100%;
    gap: 1cqw;
    flex-shrink: 0;
  }

  .mode {
    flex: 1;
    min-width: 0;

    border: none;
    background: transparent;
    padding: 0;

    color: var(--inactive);
    font-family: "Antone", Arial, sans-serif;
    font-size: clamp(9px, 2.6cqw, 30px);
    font-weight: 400;
    letter-spacing: 0.15cqw;

    white-space: nowrap;
    text-align: center;
    cursor: pointer;

    transition: color 0.2s ease;
  }

  .mode.active,
  .mode:hover {
    color: var(--active);
  }

  /* TIMER DISPLAY */

  .timer {
    flex: 1;
    min-height: 0;
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: "Antone", Arial, sans-serif;
    font-size: min(19cqw, 40cqh);
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0;
    line-height: 1;

    color: var(--active);
    white-space: nowrap;
    text-align: center;
  }

  /* CONTROLS */

  .controls {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: clamp(15px, 6cqw, 65px);
    flex-shrink: 0;
  }

  .control {
    background: transparent;
    border: none;
    color: var(--active);

    padding: 0;
    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    transition: opacity 0.2s ease;
  }

  .control:hover {
    opacity: 0.65;
  }

  .control svg {
    width: min(6cqw, 12cqh);
    height: min(6cqw, 12cqh);

    min-width: 16px;
    min-height: 16px;

    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  /* SMALL EMBEDS */

  @media (max-width: 400px) {
    :root {
      --padding-vertical: 32px;
      --padding-horizontal: 18px;
    }
  }

  @media (max-width: 250px) {
    :root {
      --padding-vertical: 20px;
      --padding-horizontal: 10px;
    }
  }

  /* SHORT EMBEDS */

  @media (max-height: 230px) {
    :root {
      --padding-vertical: 14px;
    }
  }
</style>
</head>

<body>

<div class="widget-frame">

  <div class="pomodoro">

    <!-- TIMER MODES -->

    <nav class="modes" aria-label="Timer modes">

      <button
        class="mode"
        data-mode="short"
        onclick="changeMode('short')">
        SHORT BREAK
      </button>

      <button
        class="mode active"
        data-mode="focus"
        onclick="changeMode('focus')">
        FOCUS
      </button>

      <button
        class="mode"
        data-mode="long"
        onclick="changeMode('long')">
        LONG BREAK
      </button>

    </nav>

    <!-- TIMER -->

    <div
      class="timer"
      id="timer"
      role="timer"
      aria-label="Time remaining">
      15:00
    </div>

    <!-- CONTROLS -->

    <div class="controls">

      <button
        class="control"
        id="playPause"
        onclick="toggleTimer()"
        aria-label="Play timer"
        title="Play / Pause">

        <svg id="playIcon" viewBox="0 0 24 24">
          <path d="M6 3 L20 12 L6 21 Z"/>
        </svg>

      </button>

      <button
        class="control"
        onclick="resetTimer()"
        aria-label="Reset timer"
        title="Reset timer">

        <svg viewBox="0 0 24 24">
          <path d="M3 11a9 9 0 1 1 2.5 6.2"/>
          <path d="M3 4v7h7"/>
        </svg>

      </button>

    </div>

  </div>

</div>

<script>
  const durations = {
    short: 5 * 60,
    focus: 15 * 60,
    long: 30 * 60
  };

  let currentMode = "focus";
  let remaining = durations.focus;
  let interval = null;
  let endTime = null;

  const timerDisplay = document.getElementById("timer");
  const playPauseButton = document.getElementById("playPause");
  const playIcon = document.getElementById("playIcon");

  const playSVG = `
    <path d="M6 3 L20 12 L6 21 Z"/>
  `;

  const pauseSVG = `
    <path d="M8 4v16 M16 4v16"/>
  `;

  /* DISPLAY TIME */

  function displayTime() {
    const minutes = Math.floor(remaining / 60);
    const seconds = remaining % 60;

    timerDisplay.textContent =
      String(minutes).padStart(2, "0") + ":" +
      String(seconds).padStart(2, "0");
  }

  /* UPDATE ICON */

  function updateIcon() {
    const isRunning = interval !== null;

    playIcon.innerHTML = isRunning ? pauseSVG : playSVG;

    playPauseButton.setAttribute(
      "aria-label",
      isRunning ? "Pause timer" : "Play timer"
    );
  }

  /* STOP TIMER */

  function stopTimer() {
    if (interval !== null) {
      clearInterval(interval);
      interval = null;
    }

    endTime = null;
    updateIcon();
  }

  /* CHANGE MODE */

  function changeMode(mode) {
    stopTimer();

    currentMode = mode;
    remaining = durations[mode];

    document.querySelectorAll(".mode").forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.mode === mode
      );
    });

    displayTime();
  }

  /* PLAY / PAUSE / RESUME */

  function toggleTimer() {
    if (interval !== null) {
      remaining = Math.max(
        0,
        Math.ceil((endTime - Date.now()) / 1000)
      );

      stopTimer();
      displayTime();
      return;
    }

    if (remaining === 0) {
      remaining = durations[currentMode];
    }

    endTime = Date.now() + remaining * 1000;

    interval = setInterval(() => {
      remaining = Math.max(
        0,
        Math.ceil((endTime - Date.now()) / 1000)
      );

      displayTime();

      if (remaining === 0) {
        stopTimer();
      }
    }, 250);

    updateIcon();
  }

  /* RESET */

  function resetTimer() {
    stopTimer();
    remaining = durations[currentMode];
    displayTime();
  }

  /* INITIALISE */

  displayTime();
  updateIcon();
</script>

</body>
</html>
