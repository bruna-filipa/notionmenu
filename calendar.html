
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Romantic Garden Calendar</title>

<style>
  @font-face {
    font-family: "Dream Orphans";
    src: url("./fonts/DreamOrphans.otf") format("opentype");
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #FFFFFF;
    font-family: "Dream Orphans", Georgia, serif;
  }

  .calendar {
    width: 100%;
    margin: 0;
    padding: 0;
    background: #FFFFFF;
    overflow: hidden;
  }

  .calendar-header {
    background: #402D19;
    color: #FFF9F3;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    gap: 8px;
  }

  .month-title {
    font-family: "Dream Orphans", Georgia, serif;
    font-size: 21px;
    font-weight: normal;
    text-align: center;
    flex: 1;
    white-space: nowrap;
  }

  .nav-button {
    background: transparent;
    border: none;
    color: #FFF9F3;
    font-family: Georgia, serif;
    font-size: 23px;
    cursor: pointer;
    padding: 0 8px;
    line-height: 1;
  }

  .nav-button:hover {
    color: #D9A89A;
  }

  .calendar-body {
    padding: 10px 12px 12px;
    background: #FFFFFF;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    text-align: center;
    gap: 3px;
  }

  .weekday {
    color: #402D19;
    font-family: "Dream Orphans", Georgia, serif;
    font-size: 14px;
    padding: 8px 0 12px;
  }

  .day {
    height: 34px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Dream Orphans", Georgia, serif;
    font-size: 15px;
    color: #402D19;
  }

  .other-month {
    color: #D9A89A;
    opacity: 0.65;
  }

  .today {
    background: #D9A89A;
    color: #402D19;
    font-weight: bold;
  }

  @media (max-width: 320px) {
    .calendar-header {
      padding: 10px 8px;
    }

    .calendar-body {
      padding: 7px;
    }

    .day {
      height: 29px;
      font-size: 13px;
    }

    .weekday {
      font-size: 12px;
    }

    .month-title {
      font-size: 18px;
    }
  }
</style>
</head>

<body>

<div class="calendar">

  <div class="calendar-header">
    <button class="nav-button" id="prev" aria-label="Previous month">‹</button>

    <span class="month-title" id="monthTitle"></span>

    <button class="nav-button" id="next" aria-label="Next month">›</button>
  </div>

  <div class="calendar-body">
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

</div>

<script>
  const today = new Date();

  let currentMonth = today.getMonth();
  let currentYear = today.getFullYear();

  const grid = document.getElementById("calendarGrid");
  const title = document.getElementById("monthTitle");

  const weekdays = ["M", "T", "W", "T", "F", "S", "S"];

  function renderCalendar() {
    grid.innerHTML = "";

    title.textContent = new Date(
      currentYear,
      currentMonth,
      1
    ).toLocaleDateString("en-GB", {
      month: "long",
      year: "numeric"
    });

    weekdays.forEach(day => {
      const el = document.createElement("div");
      el.className = "weekday";
      el.textContent = day;
      grid.appendChild(el);
    });

    const firstDay = new Date(
      currentYear,
      currentMonth,
      1
    );

    const offset = (firstDay.getDay() + 6) % 7;

    const daysInMonth = new Date(
      currentYear,
      currentMonth + 1,
      0
    ).getDate();

    const totalCells = Math.ceil(
      (offset + daysInMonth) / 7
    ) * 7;

    for (let i = 0; i < totalCells; i++) {
      const date = new Date(
        currentYear,
        currentMonth,
        i - offset + 1
      );

      const el = document.createElement("div");
      el.className = "day";
      el.textContent = date.getDate();

      if (date.getMonth() !== currentMonth) {
        el.classList.add("other-month");
      }

      if (
        date.getFullYear() === today.getFullYear() &&
        date.getMonth() === today.getMonth() &&
        date.getDate() === today.getDate()
      ) {
        el.classList.add("today");
      }

      grid.appendChild(el);
    }
  }

  document.getElementById("prev").addEventListener("click", () => {
    currentMonth--;

    if (currentMonth < 0) {
      currentMonth = 11;
      currentYear--;
    }

    renderCalendar();
  });

  document.getElementById("next").addEventListener("click", () => {
    currentMonth++;

    if (currentMonth > 11) {
      currentMonth = 0;
      currentYear++;
    }

    renderCalendar();
  });

  renderCalendar();
</script>

</body>
</html>
