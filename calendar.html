
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Romantic Calendar</title>

<style>
@font-face {
  font-family: "Antone";
  src: url("./fonts/Antone.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

:root {
  --background: #F5DFE5;
  --primary: #8D2B36;
  --secondary: #BE677C;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: var(--background);
}

body {
  font-family: "Antone", Arial, sans-serif;
  color: var(--primary);
}

/* MAIN CALENDAR */

.calendar {
  container-type: inline-size;
  width: 100%;
  min-height: 100%;
  padding: 3% 5%;
  background: var(--background);
}

/* MONTH HEADER */

.header {
  display: grid;
  grid-template-columns: 1fr 5fr 1fr;
  align-items: center;
  width: 100%;
  margin-bottom: 4cqw;
}

.month-title {
  margin: 0;
  text-align: center;
  font-family: "Antone", Arial, sans-serif;
  font-size: clamp(16px, 5cqw, 48px);
  font-weight: 400;
  letter-spacing: 0.25cqw;
  line-height: 1.1;
  color: var(--primary);
  white-space: nowrap;
}

.arrow {
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  padding: 3px;
  color: var(--primary);
  cursor: pointer;
}

.arrow svg {
  width: clamp(12px, 2.5cqw, 25px);
  height: clamp(12px, 2.5cqw, 25px);
  stroke: currentColor;
  stroke-width: 1.7;
  fill: none;
  stroke-linecap: square;
  stroke-linejoin: miter;
}

.arrow:hover {
  opacity: 0.65;
}

/* WEEKDAY LABELS */

.weekdays {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  width: 100%;
  margin-bottom: 2cqw;
}

.weekday {
  text-align: center;
  font-family: "Antone", Arial, sans-serif;
  font-size: clamp(10px, 3cqw, 28px);
  font-weight: 400;
  line-height: 1.1;
  color: var(--secondary);
}

/* DATE GRID */

.days {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  width: 100%;
  row-gap: 0;
}

.day {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  aspect-ratio: 1.4 / 1;
  font-family: "Antone", Arial, sans-serif;
  font-size: clamp(11px, 3.6cqw, 34px);
  font-weight: 400;
  line-height: 1;
  color: var(--primary);
  text-align: center;
  isolation: isolate;
}

.day.empty {
  visibility: hidden;
}

/* TODAY HIGHLIGHT */

.day.today {
  color: var(--background);
}

.day.today::before {
  content: "";
  position: absolute;
  z-index: -1;
  height: 78%;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  background: var(--secondary);
}

/* SMALL NOTION EMBEDS */

@container (max-width: 350px) {
  .calendar {
    padding: 3% 3%;
  }

  .month-title {
    font-size: 5cqw;
    letter-spacing: 0.1cqw;
  }

  .weekday {
    font-size: 3cqw;
  }

  .day {
    font-size: 3.7cqw;
  }

  .header {
    margin-bottom: 3cqw;
  }
}
</style>
</head>

<body>

<div class="calendar">

  <!-- MONTH NAVIGATION -->

  <div class="header">

    <button
      class="arrow"
      onclick="changeMonth(-1)"
      aria-label="Previous month">

      <svg viewBox="0 0 24 24">
        <path d="M15 3 L6 12 L15 21"/>
      </svg>

    </button>

    <h1 class="month-title" id="monthTitle">
      OCTOBER
    </h1>

    <button
      class="arrow"
      onclick="changeMonth(1)"
      aria-label="Next month">

      <svg viewBox="0 0 24 24">
        <path d="M9 3 L18 12 L9 21"/>
      </svg>

    </button>

  </div>

  <!-- MONDAY TO SUNDAY -->

  <div class="weekdays">
    <div class="weekday">M</div>
    <div class="weekday">T</div>
    <div class="weekday">W</div>
    <div class="weekday">T</div>
    <div class="weekday">F</div>
    <div class="weekday">S</div>
    <div class="weekday">S</div>
  </div>

  <!-- CALENDAR DAYS -->

  <div class="days" id="calendarDays"></div>

</div>

<script>
const today = new Date();

let currentMonth = today.getMonth();
let currentYear = today.getFullYear();

const monthNames = [
  "JANUARY",
  "FEBRUARY",
  "MARCH",
  "APRIL",
  "MAY",
  "JUNE",
  "JULY",
  "AUGUST",
  "SEPTEMBER",
  "OCTOBER",
  "NOVEMBER",
  "DECEMBER"
];

const monthTitle = document.getElementById("monthTitle");
const calendarDays = document.getElementById("calendarDays");

function renderCalendar() {
  calendarDays.innerHTML = "";
  monthTitle.textContent = monthNames[currentMonth];

  const firstDay = (
    new Date(currentYear, currentMonth, 1).getDay() + 6
  ) % 7;

  const daysInMonth = new Date(
    currentYear,
    currentMonth + 1,
    0
  ).getDate();

  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement("div");
    empty.className = "day empty";
    calendarDays.appendChild(empty);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dayElement = document.createElement("div");
    dayElement.className = "day";
    dayElement.textContent = day;

    const actualToday = new Date();

    if (
      day === actualToday.getDate() &&
      currentMonth === actualToday.getMonth() &&
      currentYear === actualToday.getFullYear()
    ) {
      dayElement.classList.add("today");
    }

    calendarDays.appendChild(dayElement);
  }
}

function changeMonth(direction) {
  currentMonth += direction;

  if (currentMonth > 11) {
    currentMonth = 0;
    currentYear++;
  }

  if (currentMonth < 0) {
    currentMonth = 11;
    currentYear--;
  }

  renderCalendar();
}

renderCalendar();
setInterval(renderCalendar, 60000);
</script>

</body>
</html>
