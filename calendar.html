
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Romantic Calendar</title>

<style>
@font-face {
  font-family: "Antone";
  src: url("./fonts/Antone.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

:root {
  --background: #F5DFE5;
  --primary: #8D2B36;
  --secondary: #BE677C;

  --outer-padding: 30px;
  --month-gap: 36px;
  --weekday-padding: 12px;
  --row-gap: 88px;
  --date-size: 12px;
  --today-circle: 22px;
}

* {
  box-sizing: border-box;
}

html {
  margin: 0;
  padding: 0;
  width: 100%;
  background: var(--background);
}

body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100vh;
  background: var(--background);
  color: var(--primary);
  font-family: "Antone", Arial, sans-serif;
}

.calendar {
  width: 100%;
  max-width: 650px;
  margin: 0 auto;
  padding:
    var(--outer-padding)
    22px
    var(--outer-padding);
}

/* MONTH HEADER */

.header {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr) 32px;
  align-items: center;
  width: 100%;
  margin-bottom: var(--month-gap);
}

.month-title {
  margin: 0;
  text-align: center;
  font-size: clamp(18px, 4vw, 28px);
  font-weight: 400;
  letter-spacing: 1px;
  line-height: 1.2;
  white-space: nowrap;
}

.arrow {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 5px;
  border: 0;
  background: transparent;
  color: var(--primary);
  cursor: pointer;
}

.arrow svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: square;
  stroke-linejoin: miter;
}

.arrow:hover {
  opacity: 0.65;
}

/* WEEKDAYS */

.weekdays {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  width: 100%;
  margin-bottom: 14px;
}

.weekday {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--weekday-padding) 0;
  color: var(--secondary);
  font-size: 13px;
  font-weight: 400;
  line-height: 1.2;
}

/* DATES */

.days {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  grid-auto-rows: 22px;
  row-gap: var(--row-gap);
  width: 100%;
}

.day {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 22px;
  color: var(--primary);
  font-size: var(--date-size);
  font-weight: 400;
  line-height: 1;
  isolation: isolate;
}

.day.empty {
  visibility: hidden;
}

/* TODAY */

.day.today {
  color: var(--background);
}

.day.today::before {
  content: "";
  position: absolute;
  z-index: -1;
  width: var(--today-circle);
  height: var(--today-circle);
  border-radius: 50%;
  background: var(--secondary);
}

/* NARROW EMBEDS */

@media (max-width: 400px) {
  .calendar {
    padding: var(--outer-padding) 12px;
  }

  .month-title {
    font-size: clamp(16px, 5vw, 22px);
  }

  .weekday {
    font-size: 11px;
  }

  .day {
    font-size: 11px;
  }
}

@media (max-width: 250px) {
  .calendar {
    padding: var(--outer-padding) 7px;
  }

  .header {
    grid-template-columns: 24px minmax(0, 1fr) 24px;
  }

  .month-title {
    font-size: 15px;
    letter-spacing: 0;
  }

  .arrow {
    width: 24px;
    height: 24px;
  }

  .weekday {
    font-size: 10px;
  }

  .day {
    font-size: 10px;
  }
}
</style>
</head>

<body>

<main class="calendar">

  <header class="header">

    <button
      class="arrow"
      type="button"
      onclick="changeMonth(-1)"
      aria-label="Previous month">
      <svg viewBox="0 0 24 24">
        <path d="M15 3 L6 12 L15 21"/>
      </svg>
    </button>

    <h1 class="month-title" id="monthTitle"></h1>

    <button
      class="arrow"
      type="button"
      onclick="changeMonth(1)"
      aria-label="Next month">
      <svg viewBox="0 0 24 24">
        <path d="M9 3 L18 12 L9 21"/>
      </svg>
    </button>

  </header>

  <div class="weekdays">
    <div class="weekday">M</div>
    <div class="weekday">T</div>
    <div class="weekday">W</div>
    <div class="weekday">T</div>
    <div class="weekday">F</div>
    <div class="weekday">S</div>
    <div class="weekday">S</div>
  </div>

  <div class="days" id="calendarDays"></div>

</main>

<script>
const today = new Date();

let currentMonth = today.getMonth();
let currentYear = today.getFullYear();

const monthNames = [
  "JANUARY", "FEBRUARY", "MARCH",
  "APRIL", "MAY", "JUNE",
  "JULY", "AUGUST", "SEPTEMBER",
  "OCTOBER", "NOVEMBER", "DECEMBER"
];

const monthTitle = document.getElementById("monthTitle");
const calendarDays = document.getElementById("calendarDays");

function renderCalendar() {
  calendarDays.innerHTML = "";
  monthTitle.textContent = monthNames[currentMonth];

  const firstDay =
    (new Date(currentYear, currentMonth, 1).getDay() + 6) % 7;

  const daysInMonth =
    new Date(currentYear, currentMonth + 1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement("div");
    empty.className = "day empty";
    calendarDays.appendChild(empty);
  }

  const now = new Date();

  for (let day = 1; day <= daysInMonth; day++) {
    const element = document.createElement("div");
    element.className = "day";
    element.textContent = day;

    if (
      day === now.getDate() &&
      currentMonth === now.getMonth() &&
      currentYear === now.getFullYear()
    ) {
      element.classList.add("today");
    }

    calendarDays.appendChild(element);
  }
}

function changeMonth(direction) {
  currentMonth += direction;

  if (currentMonth > 11) {
    currentMonth = 0;
    currentYear++;
  }

  if (currentMonth < 0) {
    currentMonth = 11;
    currentYear--;
  }

  renderCalendar();
}

renderCalendar();
setInterval(renderCalendar, 60000);
</script>

</body>
</html>
