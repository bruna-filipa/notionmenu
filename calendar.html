
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Romantic Calendar</title>

<style>
@font-face {
  font-family: "Antone";
  src: url("./fonts/Antone.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

:root {
  --background: #FFFFFF;
  --primary: #8D2B36;
  --secondary: #BE677C;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: var(--background);
}

body {
  font-family: "Antone", Arial, sans-serif;
  color: var(--primary);
}

.calendar {
  container-type: inline-size;
  width: 100%;
  max-width: 650px;
  margin: 0 auto;
  padding: 14px 12px 18px;
  background: var(--background);
}

.header {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) 28px;
  align-items: center;
  margin-bottom: clamp(12px, 5cqw, 25px);
}

.month-title {
  margin: 0;
  text-align: center;
  font-family: "Antone", Arial, sans-serif;
  font-size: clamp(16px, 5cqw, 28px);
  font-weight: 400;
  letter-spacing: 0.5px;
  line-height: 1.2;
  white-space: nowrap;
}

.arrow {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  padding: 4px;
  border: none;
  background: transparent;
  color: var(--primary);
  cursor: pointer;
}

.arrow svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: square;
  stroke-linejoin: miter;
}

.arrow:hover {
  opacity: 0.65;
}

.weekdays {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  margin-bottom: clamp(6px, 2cqw, 12px);
}

.weekday {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(4px, 1.5cqw, 10px) 0;
  color: var(--secondary);
  font-size: clamp(10px, 2.5cqw, 14px);
  line-height: 1.2;
}

.days {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  grid-auto-rows: clamp(26px, 7cqw, 42px);
  width: 100%;
}

.day {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-width: 0;
  font-size: clamp(10px, 2.3cqw, 13px);
  line-height: 1;
  isolation: isolate;
}

.day.empty {
  visibility: hidden;
}

.day.today {
  color: var(--background);
}

.day.today::before {
  content: "";
  position: absolute;
  z-index: -1;
  width: clamp(20px, 5cqw, 26px);
  height: clamp(20px, 5cqw, 26px);
  border-radius: 50%;
  background: var(--secondary);
}

@media (max-width: 300px) {
  .calendar {
    padding: 10px 7px 12px;
  }

  .header {
    grid-template-columns: 22px minmax(0, 1fr) 22px;
  }

  .arrow {
    width: 22px;
    height: 22px;
    padding: 2px;
  }

  .arrow svg {
    width: 13px;
    height: 13px;
  }

  .month-title {
    letter-spacing: 0;
  }
}
</style>
</head>

<body>

<main class="calendar">

  <header class="header">

    <button class="arrow" type="button"
      onclick="changeMonth(-1)"
      aria-label="Previous month">
      <svg viewBox="0 0 24 24">
        <path d="M15 3 L6 12 L15 21"/>
      </svg>
    </button>

    <h1 class="month-title" id="monthTitle"></h1>

    <button class="arrow" type="button"
      onclick="changeMonth(1)"
      aria-label="Next month">
      <svg viewBox="0 0 24 24">
        <path d="M9 3 L18 12 L9 21"/>
      </svg>
    </button>

  </header>

  <div class="weekdays">
    <div class="weekday">M</div>
    <div class="weekday">T</div>
    <div class="weekday">W</div>
    <div class="weekday">T</div>
    <div class="weekday">F</div>
    <div class="weekday">S</div>
    <div class="weekday">S</div>
  </div>

  <div class="days" id="calendarDays"></div>

</main>

<script>
const today = new Date();

let currentMonth = today.getMonth();
let currentYear = today.getFullYear();

const monthNames = [
  "JANUARY", "FEBRUARY", "MARCH",
  "APRIL", "MAY", "JUNE",
  "JULY", "AUGUST", "SEPTEMBER",
  "OCTOBER", "NOVEMBER", "DECEMBER"
];

const monthTitle = document.getElementById("monthTitle");
const calendarDays = document.getElementById("calendarDays");

function renderCalendar() {
  calendarDays.innerHTML = "";
  monthTitle.textContent = monthNames[currentMonth];

  const firstDay =
    (new Date(currentYear, currentMonth, 1).getDay() + 6) % 7;

  const daysInMonth =
    new Date(currentYear, currentMonth + 1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement("div");
    empty.className = "day empty";
    calendarDays.appendChild(empty);
  }

  const now = new Date();

  for (let day = 1; day <= daysInMonth; day++) {
    const element = document.createElement("div");
    element.className = "day";
    element.textContent = day;

    if (
      day === now.getDate() &&
      currentMonth === now.getMonth() &&
      currentYear === now.getFullYear()
    ) {
      element.classList.add("today");
    }

    calendarDays.appendChild(element);
  }
}

function changeMonth(direction) {
  currentMonth += direction;

  if (currentMonth > 11) {
    currentMonth = 0;
    currentYear++;
  }

  if (currentMonth < 0) {
    currentMonth = 11;
    currentYear--;
  }

  renderCalendar();
}

renderCalendar();
setInterval(renderCalendar, 60000);
</script>

</body>
</html>
