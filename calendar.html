
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Romantic Calendar</title>

<style>
  @font-face {
    font-family: "Antone";
    src: url("./fonts/Antone.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --background: #F5DFE5;
    --primary: #8D2B36;
    --secondary: #BE677C;

    --row-height: 32px;
    --date-size: 12px;
    --today-circle: 22px;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: var(--background);
  }

  body {
    font-family: "Antone", Arial, sans-serif;
    color: var(--primary);
  }

  /* MAIN CALENDAR */

  .calendar {
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
    padding: 14px 18px 18px;
    background: var(--background);
  }

  /* MONTH HEADER */

  .header {
    display: grid;
    grid-template-columns: 32px minmax(0, 1fr) 32px;
    align-items: center;
    width: 100%;
    margin-bottom: 18px;
  }

  .month-title {
    margin: 0;
    text-align: center;

    font-family: "Antone", Arial, sans-serif;
    font-size: clamp(18px, 4vw, 28px);
    font-weight: 400;
    letter-spacing: 1px;
    line-height: 1.2;

    color: var(--primary);
    white-space: nowrap;
  }

  .arrow {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 32px;
    height: 32px;

    background: transparent;
    border: none;
    padding: 5px;

    color: var(--primary);
    cursor: pointer;
  }

  .arrow svg {
    width: 17px;
    height: 17px;

    stroke: currentColor;
    stroke-width: 1.7;
    fill: none;
    stroke-linecap: square;
    stroke-linejoin: miter;
  }

  .arrow:hover {
    opacity: 0.65;
  }

  /* WEEKDAY LABELS */

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    width: 100%;
    margin-bottom: 10px;
  }

  .weekday {
    text-align: center;

    font-family: "Antone", Arial, sans-serif;
    font-size: 13px;
    font-weight: 400;
    line-height: 1.2;

    color: var(--secondary);
  }

  /* DATE GRID */

  .days {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    grid-auto-rows: var(--row-height);
    width: 100%;
    row-gap: 0;
  }

  .day {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
    height: var(--row-height);

    font-family: "Antone", Arial, sans-serif;
    font-size: var(--date-size);
    font-weight: 400;
    line-height: 1;

    color: var(--primary);
    text-align: center;
    isolation: isolate;
  }

  .day.empty {
    visibility: hidden;
  }

  /* TODAY HIGHLIGHT */

  .day.today {
    color: var(--background);
  }

  .day.today::before {
    content: "";
    position: absolute;
    z-index: -1;

    width: var(--today-circle);
    height: var(--today-circle);

    border-radius: 50%;
    background: var(--secondary);
  }

  /* SMALL NOTION EMBEDS */

  @media (max-width: 400px) {
    :root {
      --row-height: 30px;
      --date-size: 11px;
      --today-circle: 21px;
    }

    .calendar {
      padding: 12px 10px 14px;
    }

    .header {
      margin-bottom: 14px;
    }

    .month-title {
      font-size: clamp(16px, 5vw, 22px);
      letter-spacing: 0.5px;
    }

    .weekday {
      font-size: 11px;
    }
  }

  /* VERY NARROW EMBEDS */

  @media (max-width: 250px) {
    :root {
      --row-height: 27px;
      --date-size: 10px;
      --today-circle: 19px;
    }

    .calendar {
      padding: 10px 6px;
    }

    .header {
      grid-template-columns: 24px minmax(0, 1fr) 24px;
      margin-bottom: 10px;
    }

    .arrow {
      width: 24px;
      height: 24px;
      padding: 3px;
    }

    .arrow svg {
      width: 13px;
      height: 13px;
    }

    .month-title {
      font-size: 15px;
      letter-spacing: 0;
    }

    .weekday {
      font-size: 10px;
    }
  }
</style>
</head>

<body>

<div class="calendar">

  <!-- MONTH NAVIGATION -->

  <div class="header">

    <button
      class="arrow"
      onclick="changeMonth(-1)"
      aria-label="Previous month">

      <svg viewBox="0 0 24 24">
        <path d="M15 3 L6 12 L15 21"/>
      </svg>

    </button>

    <h1 class="month-title" id="monthTitle">
      OCTOBER
    </h1>

    <button
      class="arrow"
      onclick="changeMonth(1)"
      aria-label="Next month">

      <svg viewBox="0 0 24 24">
        <path d="M9 3 L18 12 L9 21"/>
      </svg>

    </button>

  </div>

  <!-- MONDAY TO SUNDAY -->

  <div class="weekdays">
    <div class="weekday">M</div>
    <div class="weekday">T</div>
    <div class="weekday">W</div>
    <div class="weekday">T</div>
    <div class="weekday">F</div>
    <div class="weekday">S</div>
    <div class="weekday">S</div>
  </div>

  <!-- CALENDAR DATES -->

  <div class="days" id="calendarDays"></div>

</div>

<script>
  const today = new Date();

  let currentMonth = today.getMonth();
  let currentYear = today.getFullYear();

  const monthNames = [
    "JANUARY",
    "FEBRUARY",
    "MARCH",
    "APRIL",
    "MAY",
    "JUNE",
    "JULY",
    "AUGUST",
    "SEPTEMBER",
    "OCTOBER",
    "NOVEMBER",
    "DECEMBER"
  ];

  const monthTitle = document.getElementById("monthTitle");
  const calendarDays = document.getElementById("calendarDays");

  /* RENDER CALENDAR */

  function renderCalendar() {
    calendarDays.innerHTML = "";
    monthTitle.textContent = monthNames[currentMonth];

    // Monday-first indexing
    const firstDay = (
      new Date(currentYear, currentMonth, 1).getDay() + 6
    ) % 7;

    const daysInMonth = new Date(
      currentYear,
      currentMonth + 1,
      0
    ).getDate();

    // Empty cells before the first date
    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement("div");
      empty.className = "day empty";
      calendarDays.appendChild(empty);
    }

    // Create dates
    for (let day = 1; day <= daysInMonth; day++) {
      const dayElement = document.createElement("div");
      dayElement.className = "day";
      dayElement.textContent = day;

      const actualToday = new Date();

      if (
        day === actualToday.getDate() &&
        currentMonth === actualToday.getMonth() &&
        currentYear === actualToday.getFullYear()
      ) {
        dayElement.classList.add("today");
      }

      calendarDays.appendChild(dayElement);
    }
  }

  /* CHANGE MONTH */

  function changeMonth(direction) {
    currentMonth += direction;

    if (currentMonth > 11) {
      currentMonth = 0;
      currentYear++;
    }

    if (currentMonth < 0) {
      currentMonth = 11;
      currentYear--;
    }

    renderCalendar();
  }

  /* INITIALISE */

  renderCalendar();

  // Refresh today's highlight automatically
  setInterval(renderCalendar, 60000);
</script>

</body>
</html>
