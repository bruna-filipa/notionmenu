
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Romantic Calendar</title>

<style>
@font-face {
  font-family: "Antone";
  src: url("./fonts/Antone.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

:root {
  --background: #F5DFE5;
  --primary: #8D2B36;
  --secondary: #BE677C;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: var(--background);
}

body {
  font-family: "Antone", Arial, sans-serif;
  color: var(--primary);
}

/* MAIN CALENDAR */

.calendar {
  container-type: inline-size;

  width: 100%;
  min-height: 100%;
  padding: 4cqw 4cqw 5cqw;

  background: var(--background);
}

/* MONTH HEADER */

.header {
  display: grid;
  grid-template-columns: 1fr 5fr 1fr;
  align-items: center;

  width: 100%;
  margin-bottom: 7cqw;
}

.month-title {
  margin: 0;
  text-align: center;

  font-family: "Antone", Arial, sans-serif;
  font-size: clamp(20px, 7.5cqw, 85px);
  font-weight: 400;
  letter-spacing: 0.4cqw;
  line-height: 1.2;

  color: var(--primary);
  white-space: nowrap;
}

.arrow {
  display: flex;
  align-items: center;
  justify-content: center;

  background: transparent;
  border: none;
  padding: 5px;

  color: var(--primary);
  cursor: pointer;
}

.arrow svg {
  width: clamp(16px, 3.5cqw, 40px);
  height: clamp(16px, 3.5cqw, 40px);

  stroke: currentColor;
  stroke-width: 1.7;
  fill: none;
  stroke-linecap: square;
  stroke-linejoin: miter;
}

.arrow:hover {
  opacity: 0.65;
}

/* WEEKDAY LABELS */

.weekdays {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  width: 100%;
  margin-bottom: 4cqw;
}

.weekday {
  text-align: center;

  font-family: "Antone", Arial, sans-serif;
  font-size: clamp(12px, 4.5cqw, 48px);
  font-weight: 400;
  line-height: 1.2;

  color: var(--secondary);
}

/* DATE GRID */

.days {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  grid-auto-rows: auto;

  width: 100%;
  row-gap: 1cqw;
}

.day {
  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  width: 100%;
  aspect-ratio: 1 / 1;

  font-family: "Antone", Arial, sans-serif;
  font-size: clamp(13px, 5.3cqw, 55px);
  font-weight: 400;
  line-height: 1;

  color: var(--primary);
  text-align: center;
  isolation: isolate;
}

.day.empty {
  visibility: hidden;
}

/* TODAY HIGHLIGHT */

.day.today {
  color: var(--background);
}

.day.today::before {
  content: "";

  position: absolute;
  z-index: -1;

  width: 88%;
  aspect-ratio: 1 / 1;

  border-radius: 50%;
  background: var(--secondary);
}

/* SMALL NOTION EMBEDS */

@container (max-width: 400px) {

  .calendar {
    padding: 4cqw 3cqw;
  }

  .header {
    margin-bottom: 6cqw;
  }

  .month-title {
    font-size: 7cqw;
    letter-spacing: 0.15cqw;
  }

  .weekday {
    font-size: 4cqw;
  }

  .day {
    font-size: 5cqw;
  }

  .days {
    row-gap: 0;
  }
}

/* VERY NARROW EMBEDS */

@container (max-width: 250px) {

  .month-title {
    font-size: 6.5cqw;
    letter-spacing: 0;
  }

  .weekday {
    font-size: 3.8cqw;
  }

  .day {
    font-size: 4.8cqw;
  }

  .header {
    margin-bottom: 5cqw;
  }
}

</style>
</head>

<body>

<div class="calendar">

  <!-- MONTH NAVIGATION -->

  <div class="header">

    <button
      class="arrow"
      onclick="changeMonth(-1)"
      aria-label="Previous month">

      <svg viewBox="0 0 24 24">
        <path d="M15 3 L6 12 L15 21"/>
      </svg>

    </button>

    <h1 class="month-title" id="monthTitle">
      OCTOBER
    </h1>

    <button
      class="arrow"
      onclick="changeMonth(1)"
      aria-label="Next month">

      <svg viewBox="0 0 24 24">
        <path d="M9 3 L18 12 L9 21"/>
      </svg>

    </button>

  </div>

  <!-- MONDAY TO SUNDAY -->

  <div class="weekdays">
    <div class="weekday">M</div>
    <div class="weekday">T</div>
    <div class="weekday">W</div>
    <div class="weekday">T</div>
    <div class="weekday">F</div>
    <div class="weekday">S</div>
    <div class="weekday">S</div>
  </div>

  <!-- CALENDAR DAYS -->

  <div class="days" id="calendarDays"></div>

</div>

<script>
const today = new Date();

let currentMonth = today.getMonth();
let currentYear = today.getFullYear();

const monthNames = [
  "JANUARY",
  "FEBRUARY",
  "MARCH",
  "APRIL",
  "MAY",
  "JUNE",
  "JULY",
  "AUGUST",
  "SEPTEMBER",
  "OCTOBER",
  "NOVEMBER",
  "DECEMBER"
];

const monthTitle = document.getElementById("monthTitle");
const calendarDays = document.getElementById("calendarDays");

/* RENDER CALENDAR */

function renderCalendar() {

  calendarDays.innerHTML = "";

  monthTitle.textContent = monthNames[currentMonth];

  // Convert Sunday-first indexing to Monday-first
  const firstDay = (
    new Date(currentYear, currentMonth, 1).getDay() + 6
  ) % 7;

  const daysInMonth = new Date(
    currentYear,
    currentMonth + 1,
    0
  ).getDate();

  // Empty spaces before the first day
  for (let i = 0; i < firstDay; i++) {

    const empty = document.createElement("div");
    empty.className = "day empty";

    calendarDays.appendChild(empty);
  }

  // Create days
  for (let day = 1; day <= daysInMonth; day++) {

    const dayElement = document.createElement("div");
    dayElement.className = "day";
    dayElement.textContent = day;

    // Highlight today's date
    const actualToday = new Date();

    if (
      day === actualToday.getDate() &&
      currentMonth === actualToday.getMonth() &&
      currentYear === actualToday.getFullYear()
    ) {
      dayElement.classList.add("today");
    }

    calendarDays.appendChild(dayElement);
  }
}

/* CHANGE MONTH */

function changeMonth(direction) {

  currentMonth += direction;

  if (currentMonth > 11) {
    currentMonth = 0;
    currentYear++;
  }

  if (currentMonth < 0) {
    currentMonth = 11;
    currentYear--;
  }

  renderCalendar();
}

/* INITIALISE */

renderCalendar();

// Refresh today's highlight periodically
setInterval(renderCalendar, 60000);
</script>

</body>
</html>
