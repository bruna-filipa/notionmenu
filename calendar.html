
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Romantic Calendar</title>

<style>
  @font-face {
    font-family: "Antone";
    src: url("./fonts/Antone.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --background: #F5DFE5;
    --primary: #8D2B36;
    --secondary: #BE677C;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--background);
  }

  body {
    font-family: "Antone", Arial, sans-serif;
    color: var(--primary);
  }

  .calendar {
    container-type: inline-size;
    width: 100%;
    min-height: 100%;
    padding: 4% 4% 5%;
    background: var(--background);
  }

  /* MONTH HEADER */

  .header {
    display: grid;
    grid-template-columns: 1fr 5fr 1fr;
    align-items: center;
    margin-bottom: 8%;
  }

  .month-title {
    text-align: center;
    font-size: clamp(22px, 8cqw, 85px);
    font-weight: 400;
    letter-spacing: 0.45cqw;
    line-height: 1.2;
    margin: 0;
    white-space: nowrap;
  }

  .arrow {
    border: none;
    background: transparent;
    color: var(--primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }

  .arrow svg {
    width: clamp(15px, 4cqw, 40px);
    height: clamp(15px, 4cqw, 40px);
    stroke: currentColor;
    stroke-width: 1.7;
    fill: none;
    stroke-linecap: square;
    stroke-linejoin: miter;
  }

  .arrow:hover {
    opacity: 0.65;
  }

  /* WEEKDAY LABELS */

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    margin-bottom: 5%;
  }

  .weekday {
    color: var(--secondary);
    text-align: center;
    font-size: clamp(12px, 4.5cqw, 48px);
    letter-spacing: 0.1cqw;
    line-height: 1.2;
  }

  /* DATE GRID */

  .days {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    grid-auto-rows: 1fr;
    row-gap: 1.2cqw;
  }

  .day {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1 / 1;

    font-size: clamp(13px, 5.5cqw, 55px);
    color: var(--primary);
    font-weight: 400;
    line-height: 1;

    position: relative;
    z-index: 0;
  }

  .day.empty {
    visibility: hidden;
  }

  .day.today {
    color: var(--background);
  }

  .day.today::before {
    content: "";
    position: absolute;
    z-index: -1;

    width: 88%;
    height: 88%;
    border-radius: 50%;
    background: var(--secondary);
  }

  @container (max-width: 350px) {
    .calendar {
      padding: 5% 3%;
    }

    .header {
      margin-bottom: 9%;
    }

    .month-title {
      letter-spacing: 0.2cqw;
    }

    .days {
      row-gap: 0;
    }
  }
</style>
</head>

<body>

<div class="calendar">

  <!-- MONTH NAVIGATION -->

  <div class="header">

    <button
      class="arrow"
      onclick="changeMonth(-1)"
      aria-label="Previous month">

      <svg viewBox="0 0 24 24">
        <path d="M15 3 L6 12 L15 21"/>
      </svg>

    </button>

    <h1 class="month-title" id="monthTitle">
      OCTOBER
    </h1>

    <button
      class="arrow"
      onclick="changeMonth(1)"
      aria-label="Next month">

      <svg viewBox="0 0 24 24">
        <path d="M9 3 L18 12 L9 21"/>
      </svg>

    </button>

  </div>

  <!-- WEEKDAY HEADINGS -->

  <div class="weekdays">
    <div class="weekday">S</div>
    <div class="weekday">M</div>
    <div class="weekday">T</div>
    <div class="weekday">W</div>
    <div class="weekday">T</div>
    <div class="weekday">F</div>
    <div class="weekday">S</div>
  </div>

  <!-- CALENDAR DATES -->

  <div class="days" id="calendarDays"></div>

</div>

<script>
  const today = new Date();

  let currentMonth = today.getMonth();
  let currentYear = today.getFullYear();

  const monthNames = [
    "JANUARY",
    "FEBRUARY",
    "MARCH",
    "APRIL",
    "MAY",
    "JUNE",
    "JULY",
    "AUGUST",
    "SEPTEMBER",
    "OCTOBER",
    "NOVEMBER",
    "DECEMBER"
  ];

  const monthTitle = document.getElementById("monthTitle");
  const calendarDays = document.getElementById("calendarDays");

  function renderCalendar() {

    calendarDays.innerHTML = "";

    monthTitle.textContent = monthNames[currentMonth];

    const firstDay = new Date(
      currentYear,
      currentMonth,
      1
    ).getDay();

    const daysInMonth = new Date(
      currentYear,
      currentMonth + 1,
      0
    ).getDate();

    // Add empty spaces before the first day
    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement("div");
      empty.className = "day empty";
      calendarDays.appendChild(empty);
    }

    // Add each date
    for (let day = 1; day <= daysInMonth; day++) {

      const dayElement = document.createElement("div");
      dayElement.className = "day";
      dayElement.textContent = day;

      // Highlight today's date
      if (
        day === today.getDate() &&
        currentMonth === today.getMonth() &&
        currentYear === today.getFullYear()
      ) {
        dayElement.classList.add("today");
      }

      calendarDays.appendChild(dayElement);
    }
  }

  function changeMonth(direction) {

    currentMonth += direction;

    if (currentMonth > 11) {
      currentMonth = 0;
      currentYear++;
    }

    if (currentMonth < 0) {
      currentMonth = 11;
      currentYear--;
    }

    renderCalendar();
  }

  renderCalendar();
</script>

</body>
</html>
