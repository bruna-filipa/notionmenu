
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    .sidebar {
      background-color: #DEA6AE;
      color: #791611;
      border-radius: 12px;
      padding: 20px 22px;
      width: 100%;
    }

    .sidebar-title {
      font-size: 17px;
      font-weight: 700;
      margin: 0 0 16px;
    }

    .sidebar-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sidebar-links a {
      color: #791611;
      font-size: 15px;
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .sidebar-links a:hover {
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div class="sidebar">
    <div class="sidebar-title">
      Navigation Side Bar
    </div>

    <nav class="sidebar-links">
      <a href="YOUR_NOTION_PAGE_URL_1" target="_blank">
        ☁️ Pending To Do's
      </a>

      <a href="YOUR_NOTION_PAGE_URL_2" target="_blank">
        ☁️ Knowledge Material
      </a>
    </nav>
  </div>
</body>
</html>
