
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Romantic Garden | Vintage Clock</title>

  <style>
    :root {
      --espresso: #402D19;
      --ivory: #FFF9F3;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clock {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(4px, 1.5vw, 12px);
      width: 100%;
      height: 100%;
    }

    .digit {
      display: flex;
      align-items: center;
      justify-content: center;

      flex: 1 1 0;
      min-width: 0;
      height: 90%;

      background: var(--espresso);
      color: var(--ivory);

      border-radius: 6px;

      font-family: Georgia, serif;
      font-size: clamp(28px, 10cqw, 100px);
      font-weight: 400;
      line-height: 1;

      font-variant-numeric: tabular-nums;
    }

    .separator {
      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--espresso);

      font-family: Georgia, serif;
      font-size: clamp(24px, 7cqw, 75px);
      line-height: 1;
    }

    .clock-container {
      width: 100%;
      height: 100%;
      container-type: inline-size;
    }

    @media (max-width: 400px) {
      .clock {
        gap: 4px;
      }

      .digit {
        border-radius: 4px;
      }
    }
  </style>
</head>

<body>

  <div class="clock-container">
    <div class="clock">

      <div class="digit" id="h1">0</div>
      <div class="digit" id="h2">0</div>

      <div class="separator">:</div>

      <div class="digit" id="m1">0</div>
      <div class="digit" id="m2">0</div>

    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      const londonTime = new Intl.DateTimeFormat(
        "en-GB",
        {
          timeZone: "Europe/London",
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23"
        }
      ).format(now);

      const [hours, minutes] = londonTime.split(":");

      document.getElementById("h1").textContent = hours[0];
      document.getElementById("h2").textContent = hours[1];

      document.getElementById("m1").textContent = minutes[0];
      document.getElementById("m2").textContent = minutes[1];
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
