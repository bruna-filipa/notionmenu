
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Romantic Garden | Flip Clock</title>

<style>
@font-face {
  font-family: "Dream Orphans";
  src: url("./fonts/Dream%20Orphans.otf") format("opentype");
  font-display: swap;
}

:root {
  --espresso: #402D19;
  --ivory: #FFF9F3;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent !important;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

.clock {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(4px, 1vw, 12px);
  width: 100%;
  height: 100%;
  padding: 8px;
}

.digit {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;

  width: clamp(30px, 13%, 150px);
  aspect-ratio: 0.72;

  background: var(--espresso);
  color: var(--ivory);

  border-radius: clamp(4px, 0.8vw, 10px);
  overflow: hidden;

  font-family: "Dream Orphans", Georgia, serif;
  font-size: clamp(35px, 9vw, 170px);
  font-weight: normal;
  font-variant-numeric: lining-nums;
  line-height: 1;
}

.digit span {
  display: block;
  line-height: 1;
  transform: translateY(-2%);
}

.separator {
  color: var(--espresso);
  font-family: "Dream Orphans", Georgia, serif;
  font-size: clamp(35px, 8vw, 140px);
  line-height: 1;
  align-self: center;
}

.digit.flip span {
  animation: flip 0.35s ease-in-out;
}

@keyframes flip {
  0% {
    transform: translateY(-2%) rotateX(0deg);
    opacity: 1;
  }

  50% {
    transform: translateY(-2%) rotateX(-70deg);
    opacity: 0.65;
  }

  100% {
    transform: translateY(-2%) rotateX(0deg);
    opacity: 1;
  }
}

@media (prefers-reduced-motion: reduce) {
  .digit.flip span {
    animation: none;
  }
}
</style>
</head>

<body>

<div class="clock" aria-label="Current UK time">
  <div class="digit"><span id="h1">0</span></div>
  <div class="digit"><span id="h2">0</span></div>

  <div class="separator">:</div>

  <div class="digit"><span id="m1">0</span></div>
  <div class="digit"><span id="m2">0</span></div>
</div>

<script>
const digitIds = ["h1", "h2", "m1", "m2"];

function updateClock() {
  const now = new Date();

  const time = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/London",
    hour: "2-digit",
    minute: "2-digit",
    hourCycle: "h23"
  }).format(now);

  const numbers = time.replace(/\D/g, "");

  digitIds.forEach((id, index) => {
    const element = document.getElementById(id);
    const newNumber = numbers[index];

    if (element.textContent !== newNumber) {
      element.textContent = newNumber;

      const card = element.parentElement;
      card.classList.remove("flip");

      void card.offsetWidth;

      card.classList.add("flip");
    }
  });
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
