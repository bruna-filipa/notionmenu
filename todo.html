
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Romantic Garden | To-Do List</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --espresso: #402D19;
      --rose: #BF687C;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: var(--white);
    }

    body {
      font-family: "Inter", Arial, sans-serif;
      color: var(--espresso);
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .todo-widget {
      container-type: inline-size;
      width: 100%;
      padding: 16px;
      background: var(--white);
    }

    /* Scrollable task list */

    .task-list {
      height: 250px;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--rose) transparent;
      padding-right: 5px;
    }

    .task-list::-webkit-scrollbar {
      width: 4px;
    }

    .task-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .task-list::-webkit-scrollbar-thumb {
      background: var(--rose);
      border-radius: 10px;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 32px;
      padding: 5px 0;
    }

    .task-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 9px;
      height: 9px;
      min-width: 9px;
      padding: 0;
      margin: 0;
      border: 1px solid var(--espresso);
      border-radius: 1px;
      background: transparent;
      cursor: pointer;
      position: relative;
    }

    .task-checkbox:checked {
      background: var(--rose);
      border-color: var(--rose);
    }

    .task-checkbox:checked::after {
      content: "";
      position: absolute;
      left: 2px;
      top: 0;
      width: 2px;
      height: 4px;
      border: solid white;
      border-width: 0 1px 1px 0;
      transform: rotate(45deg);
    }

    .task-text {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      cursor: text;
    }

    .task.completed .task-text {
      color: var(--rose);
      text-decoration: line-through;
    }

    .task-edit {
      flex: 1;
      min-width: 0;
      padding: 0;
      border: none;
      outline: none;
      background: transparent;
      color: var(--espresso);
      font-size: 13px;
      line-height: 1.5;
    }

    .delete-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--espresso);
    }

    .delete-button svg {
      width: 11px;
      height: 11px;
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
    }

    .add-task {
      display: flex;
      align-items: center;
      width: 100%;
      margin-top: 10px;
      border: 1px solid var(--rose);
      border-radius: 6px;
      background: var(--white);
    }

    .add-input {
      flex: 1;
      min-width: 0;
      padding: 10px 11px;
      border: none;
      outline: none;
      background: transparent;
      color: var(--espresso);
      font-size: 13px;
    }

    .add-input::placeholder {
      color: var(--espresso);
      opacity: 1;
    }

    .add-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 35px;
      height: 35px;
      flex-shrink: 0;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--espresso);
    }

    .add-button svg {
      width: 11px;
      height: 11px;
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      color: var(--rose);
      font-size: 11px;
    }

    .toggle-completed {
      padding: 0;
      border: none;
      background: transparent;
      color: var(--rose);
      font-size: 11px;
      text-decoration: none;
    }

    @media (max-width: 400px) {
      .todo-widget {
        padding: 12px;
      }
    }

    @container (max-width: 320px) {
      .task-text,
      .task-edit,
      .add-input {
        font-size: 12px;
      }

      .footer,
      .toggle-completed {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <main class="todo-widget">

    <div
      class="task-list"
      id="taskList"
      aria-label="To-do tasks"
    ></div>

    <div class="add-task">

      <input
        class="add-input"
        id="newTaskInput"
        type="text"
        placeholder="Something to add?"
        aria-label="New task"
      >

      <button
        class="add-button"
        id="addButton"
        type="button"
        aria-label="Add task"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>

    </div>

    <div class="footer">

      <span id="taskCounter">
        0 of 0 completed
      </span>

      <button
        class="toggle-completed"
        id="toggleCompleted"
        type="button"
      >
        Hide completed
      </button>

    </div>

  </main>

  <script>
    const STORAGE_KEY =
      "romanticGardenTodoV2";

    const VISIBILITY_KEY =
      "romanticGardenShowCompletedV2";

    const taskList =
      document.getElementById("taskList");

    const newTaskInput =
      document.getElementById("newTaskInput");

    const addButton =
      document.getElementById("addButton");

    const taskCounter =
      document.getElementById("taskCounter");

    const toggleCompleted =
      document.getElementById("toggleCompleted");

    function loadTasks() {
      try {
        const saved = JSON.parse(
          localStorage.getItem(STORAGE_KEY)
        );

        return Array.isArray(saved) ? saved : [];
      } catch (error) {
        return [];
      }
    }

    let tasks = loadTasks();

    let showCompleted = true;

    try {
      showCompleted =
        localStorage.getItem(VISIBILITY_KEY) !== "false";
    } catch (error) {
      showCompleted = true;
    }

    function saveTasks() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(tasks)
        );
      } catch (error) {
        console.warn("Unable to save tasks.", error);
      }
    }

    function saveVisibility() {
      try {
        localStorage.setItem(
          VISIBILITY_KEY,
          String(showCompleted)
        );
      } catch (error) {
        console.warn(
          "Unable to save visibility preference.",
          error
        );
      }
    }

    function createIcon(type) {
      const svg = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "svg"
      );

      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("aria-hidden", "true");

      const path = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );

      if (type === "delete") {
        path.setAttribute("d", "M5 5L19 19M19 5L5 19");
      }

      svg.appendChild(path);

      return svg;
    }

    function startEditing(task, textElement) {
      const input = document.createElement("input");

      input.type = "text";
      input.className = "task-edit";
      input.value = task.text;
      input.setAttribute("aria-label", "Edit task");

      textElement.replaceWith(input);

      input.focus();
      input.select();

      let finished = false;

      function finishEditing(save) {
        if (finished) return;
        finished = true;

        if (save) {
          const newText = input.value.trim();

          if (newText === "") {
            tasks = tasks.filter(
              item => item.id !== task.id
            );
          } else {
            task.text = newText;
          }

          saveTasks();
        }

        render();
      }

      input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          finishEditing(true);
        }

        if (event.key === "Escape") {
          event.preventDefault();
          finishEditing(false);
        }
      });

      input.addEventListener("blur", () => {
        finishEditing(true);
      });
    }

    function render() {
      const previousScroll = taskList.scrollTop;

      taskList.innerHTML = "";

      tasks.forEach(task => {
        if (!showCompleted && task.completed) {
          return;
        }

        const row = document.createElement("div");
        row.className = "task";

        if (task.completed) {
          row.classList.add("completed");
        }

        const checkbox =
          document.createElement("input");

        checkbox.type = "checkbox";
        checkbox.className = "task-checkbox";
        checkbox.checked = Boolean(task.completed);

        checkbox.setAttribute(
          "aria-label",
          "Mark task as completed"
        );

        checkbox.addEventListener("change", () => {
          task.completed = checkbox.checked;
          saveTasks();
          render();
        });

        const text =
          document.createElement("span");

        text.className = "task-text";
        text.textContent = task.text;
        text.tabIndex = 0;
        text.setAttribute("role", "button");
        text.setAttribute(
          "aria-label",
          "Edit " + task.text
        );

        text.addEventListener("click", () => {
          startEditing(task, text);
        });

        text.addEventListener("keydown", event => {
          if (
            event.key === "Enter" ||
            event.key === " "
          ) {
            event.preventDefault();
            startEditing(task, text);
          }
        });

        const deleteButton =
          document.createElement("button");

        deleteButton.type = "button";
        deleteButton.className = "delete-button";
        deleteButton.setAttribute(
          "aria-label",
          "Delete " + task.text
        );

        deleteButton.appendChild(
          createIcon("delete")
        );

        deleteButton.addEventListener(
          "click",
          () => {
            tasks = tasks.filter(
              item => item.id !== task.id
            );

            saveTasks();
            render();
          }
        );

        row.appendChild(checkbox);
        row.appendChild(text);
        row.appendChild(deleteButton);

        taskList.appendChild(row);
      });

      const completedCount =
        tasks.filter(task => task.completed).length;

      taskCounter.textContent =
        completedCount +
        " of " +
        tasks.length +
        " completed";

      toggleCompleted.textContent =
        showCompleted
          ? "Hide completed"
          : "Show completed";

      taskList.scrollTop = previousScroll;
    }

    function addTask() {
      const text = newTaskInput.value.trim();

      if (!text) return;

      tasks.push({
        id:
          Date.now().toString() +
          Math.random().toString(36).slice(2),
        text,
        completed: false
      });

      newTaskInput.value = "";

      saveTasks();
      render();

      taskList.scrollTop = taskList.scrollHeight;
      newTaskInput.focus();
    }

    addButton.addEventListener("click", addTask);

    newTaskInput.addEventListener(
      "keydown",
      event => {
        if (event.key === "Enter") {
          event.preventDefault();
          addTask();
        }
      }
    );

    toggleCompleted.addEventListener(
      "click",
      () => {
        showCompleted = !showCompleted;

        saveVisibility();
        render();
      }
    );

    render();
  </script>

</body>
</html>
