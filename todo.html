
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Romantic Garden | To-Do List</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --espresso: #402D19;
      --rose: #BF687C;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--white);
    }

    body {
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      color: var(--espresso);
      -webkit-font-smoothing: antialiased;
    }

    .todo-widget {
      width: 100%;
      padding: 16px;
      background: var(--white);
      container-type: inline-size;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 9px;
      height: 9px;
      min-width: 9px;
      min-height: 9px;
      padding: 0;
      margin: 0;
      border: 1px solid var(--espresso);
      border-radius: 0;
      background: var(--white);
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }

    .checkbox:checked {
      background: var(--rose);
      border-color: var(--rose);
    }

    .checkbox:checked::after {
      content: "";
      position: absolute;
      width: 4px;
      height: 2px;
      border-left: 1px solid white;
      border-bottom: 1px solid white;
      transform: rotate(-45deg);
      top: 1px;
      left: 1px;
    }

    .task-text {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--espresso);
      overflow-wrap: anywhere;
    }

    .task.completed .task-text {
      color: var(--rose);
      text-decoration: line-through;
      text-decoration-color: var(--rose);
    }

    button {
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .delete-button,
    .add-button {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--espresso);
    }

    .delete-button svg,
    .add-button svg {
      width: 11px;
      height: 11px;
      fill: none;
      stroke: var(--espresso);
      stroke-width: 1.7;
      stroke-linecap: round;
    }

    /* Input box with the plus inside */

    .add-form {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin-top: 16px;
      padding: 5px 9px 5px 12px;
      border: 1px solid var(--rose);
      border-radius: 6px;
      background: var(--white);
    }

    .task-input {
      flex: 1;
      min-width: 0;
      padding: 6px 0;
      border: none;
      outline: none;
      background: transparent;
      color: var(--espresso);
      font-family: inherit;
      font-size: 13px;
      line-height: 1.4;
    }

    .task-input::placeholder {
      color: var(--espresso);
      opacity: 0.7;
    }

    /* Completion counter and visibility toggle */

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px 12px;
      margin-top: 14px;
    }

    .counter,
    .toggle-button {
      font-family: inherit;
      font-size: 11px;
      line-height: 1.5;
    }

    .counter {
      color: var(--espresso);
    }

    .toggle-button {
      padding: 0;
      border: none;
      background: transparent;
      color: var(--rose);
      text-decoration: none;
    }

    /* Rose divider below the footer */

    .divider {
      width: 100%;
      height: 1px;
      margin: 13px 0 0;
      border: 0;
      background: var(--rose);
    }

    .checkbox:focus-visible,
    .delete-button:focus-visible,
    .add-button:focus-visible,
    .toggle-button:focus-visible,
    .add-form:focus-within {
      outline: 2px solid var(--rose);
      outline-offset: 3px;
    }

    @container (max-width: 320px) {
      .task {
        gap: 9px;
      }

      .task-text,
      .task-input {
        font-size: 12px;
      }

      .counter,
      .toggle-button {
        font-size: 10px;
      }
    }

    @media (max-width: 400px) {
      .todo-widget {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <main class="todo-widget">

    <div class="task-list" id="taskList"></div>

    <form class="add-form" id="addForm">

      <input
        class="task-input"
        id="taskInput"
        type="text"
        placeholder="Something to add?"
        aria-label="New task"
        autocomplete="off"
        maxlength="500"
      >

      <button
        class="add-button"
        type="submit"
        aria-label="Add task"
      >
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M10 3 V17 M3 10 H17"/>
        </svg>
      </button>

    </form>

    <footer class="footer">

      <span class="counter" id="counter"></span>

      <button
        class="toggle-button"
        id="toggleCompleted"
        type="button"
      >
        Hide completed
      </button>

    </footer>

    <hr class="divider">

  </main>

  <script>
    // Keep the existing storage keys to preserve your tasks.
    const STORAGE_KEY = "romanticGardenTodoV2";
    const VISIBILITY_KEY = "romanticGardenShowCompletedV2";

    function loadTasks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved !== null) {
          const parsed = JSON.parse(saved);

          if (Array.isArray(parsed)) {
            return parsed.filter(task =>
              task &&
              typeof task.id === "string" &&
              typeof task.text === "string" &&
              typeof task.done === "boolean"
            );
          }
        }
      } catch (error) {
        console.warn("Unable to load saved tasks.", error);
      }

      return [];
    }

    let tasks = loadTasks();
    let showCompleted = true;

    try {
      showCompleted =
        localStorage.getItem(VISIBILITY_KEY) !== "false";
    } catch (error) {
      console.warn("Unable to load visibility setting.", error);
    }

    const taskList = document.getElementById("taskList");
    const taskInput = document.getElementById("taskInput");
    const addForm = document.getElementById("addForm");
    const counter = document.getElementById("counter");
    const toggleCompleted =
      document.getElementById("toggleCompleted");

    function saveTasks() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(tasks)
        );
      } catch (error) {
        console.warn("Unable to save tasks.", error);
      }
    }

    function saveVisibility() {
      try {
        localStorage.setItem(
          VISIBILITY_KEY,
          String(showCompleted)
        );
      } catch (error) {
        console.warn("Unable to save visibility.", error);
      }
    }

    function createDeleteIcon() {
      const svgNS = "http://www.w3.org/2000/svg";

      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("viewBox", "0 0 20 20");
      svg.setAttribute("aria-hidden", "true");

      const path = document.createElementNS(svgNS, "path");
      path.setAttribute(
        "d",
        "M5 5 L15 15 M15 5 L5 15"
      );

      svg.appendChild(path);
      return svg;
    }

    function renderTasks() {
      taskList.replaceChildren();

      const visibleTasks = tasks.filter(task =>
        showCompleted || !task.done
      );

      visibleTasks.forEach(task => {
        const row = document.createElement("div");
        row.className =
          "task" + (task.done ? " completed" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "checkbox";
        checkbox.checked = task.done;

        checkbox.setAttribute(
          "aria-label",
          "Mark " + task.text + " as " +
          (task.done ? "incomplete" : "complete")
        );

        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const deleteButton =
          document.createElement("button");

        deleteButton.type = "button";
        deleteButton.className = "delete-button";

        deleteButton.setAttribute(
          "aria-label",
          "Delete " + task.text
        );

        deleteButton.appendChild(createDeleteIcon());

        deleteButton.addEventListener("click", () => {
          tasks = tasks.filter(item => item.id !== task.id);
          saveTasks();
          renderTasks();
        });

        row.appendChild(checkbox);
        row.appendChild(text);
        row.appendChild(deleteButton);

        taskList.appendChild(row);
      });

      const completedCount =
        tasks.filter(task => task.done).length;

      counter.textContent =
        completedCount +
        " of " +
        tasks.length +
        " completed";

      toggleCompleted.textContent =
        showCompleted
          ? "Hide completed"
          : "Show completed";
    }

    function addTask() {
      const value = taskInput.value.trim();

      if (!value) return;

      const id =
        typeof crypto !== "undefined" &&
        typeof crypto.randomUUID === "function"
          ? crypto.randomUUID()
          : Date.now().toString() +
            "-" +
            Math.random().toString(36).slice(2);

      tasks.push({
        id: id,
        text: value,
        done: false
      });

      taskInput.value = "";

      saveTasks();
      renderTasks();

      taskInput.focus();
    }

    addForm.addEventListener("submit", event => {
      event.preventDefault();
      addTask();
    });

    toggleCompleted.addEventListener("click", () => {
      showCompleted = !showCompleted;
      saveVisibility();
      renderTasks();
    });

    renderTasks();
  </script>

</body>
</html>
